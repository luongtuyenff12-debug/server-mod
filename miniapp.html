<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Xác Thực ID Free Fire</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--tg-theme-bg-color, #17212b);
    color: var(--tg-theme-text-color, #f5f5f5);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px;
  }
  .logo {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, #2196F3, #6c2bd9);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    margin: 20px auto 16px;
    box-shadow: 0 4px 20px rgba(108,43,217,0.4);
  }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; text-align:center; }
  .subtitle { font-size: 13px; opacity: 0.6; text-align:center; margin-bottom: 24px; }

  .card {
    background: var(--tg-theme-secondary-bg-color, #232e3c);
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 400px;
    margin-bottom: 16px;
  }

  .id-display {
    font-size: 22px; font-weight: 800;
    text-align: center;
    letter-spacing: 1px;
    color: #64b5f6;
    padding: 12px 0;
  }

  /* STATUS */
  .status-icon { font-size: 36px; text-align:center; margin-bottom: 10px; }
  .status-text { font-size: 15px; font-weight: 600; text-align:center; }
  .status-sub  { font-size: 13px; opacity: 0.6; text-align:center; margin-top:4px; }

  /* STEPS */
  .steps { display:flex; justify-content:center; gap:8px; margin: 16px 0; }
  .step {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items:center; justify-content:center;
    font-size: 13px; font-weight: 700;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.15);
    transition: all 0.3s ease;
  }
  .step.active { background: #2196F3; border-color: #2196F3; box-shadow: 0 0 12px rgba(33,150,243,0.5); }
  .step.done   { background: #4CAF50; border-color: #4CAF50; }

  /* PROGRESS BAR */
  .progress-wrap {
    background: rgba(255,255,255,0.08);
    border-radius: 8px; height: 6px;
    overflow: hidden; margin: 12px 0;
  }
  .progress-bar {
    height: 100%; border-radius: 8px;
    background: linear-gradient(90deg, #2196F3, #6c2bd9);
    transition: width 0.5s ease;
    width: 0%;
  }

  /* IFRAME */
  #webframe-wrap {
    position: fixed; inset: 0;
    background: #000;
    z-index: 9999;
    display: none;
    flex-direction: column;
  }
  #webframe-wrap.visible { display: flex; }
  #webframe-header {
    background: #1a1a2e;
    padding: 10px 16px;
    display: flex; align-items:center; gap:10px;
    font-size: 13px;
  }
  #webframe-url {
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0.7; font-size: 12px;
  }
  iframe#webframe {
    flex: 1; width: 100%; border: none;
    background: #fff;
  }
  .close-btn {
    background: rgba(255,255,255,0.1);
    border: none; color: #fff;
    border-radius: 8px; padding: 6px 12px;
    font-size: 13px; cursor: pointer;
  }

  /* BUTTONS */
  .btn-start {
    width: 100%; max-width: 400px;
    background: linear-gradient(135deg, #2196F3, #6c2bd9);
    border: none; border-radius: 14px;
    color: #fff; font-size: 16px; font-weight: 700;
    padding: 16px; cursor: pointer;
    transition: opacity 0.2s;
    box-shadow: 0 4px 16px rgba(108,43,217,0.35);
  }
  .btn-start:active { opacity: 0.8; }
  .btn-start:disabled { opacity: 0.45; cursor: not-allowed; }

  .success-wrap {
    display: none;
    flex-direction: column; align-items:center;
    gap: 12px;
  }
  .success-wrap.show { display: flex; }
  .expires-badge {
    background: rgba(76,175,80,0.2);
    border: 1px solid #4CAF50;
    border-radius: 12px; padding: 12px 20px;
    text-align:center;
  }
  .expires-badge b { color: #81C784; font-size: 20px; display:block; margin-bottom:4px; }

  #log {
    font-size: 11px; opacity: 0.45;
    font-family: monospace;
    text-align:center; margin-top:8px;
    max-height: 80px; overflow:hidden;
  }
</style>
</head>
<body>

<div class="logo">🆔</div>
<h1>Xác Thực Free Fire</h1>
<p class="subtitle">Tự động qua 4 bước · Không cần làm gì</p>

<!-- ID card -->
<div class="card" id="card-id">
  <div style="font-size:12px;opacity:0.5;text-align:center;margin-bottom:4px;">ID của bạn</div>
  <div class="id-display" id="el-id">---</div>
</div>

<!-- Progress card -->
<div class="card" id="card-progress">
  <div class="status-icon" id="st-icon">⏳</div>
  <div class="status-text" id="st-text">Sẵn sàng xác thực</div>
  <div class="status-sub"  id="st-sub">Nhấn nút bên dưới để bắt đầu</div>

  <div class="steps" id="steps-row">
    <div class="step" id="s1">1</div>
    <div class="step" id="s2">2</div>
    <div class="step" id="s3">3</div>
    <div class="step" id="s4">4</div>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar" id="pbar"></div>

</div>

<!-- Success block -->
<div class="success-wrap" id="success-wrap">
  <div class="expires-badge">
    <b id="el-expires">--:--:--</b>
    <span style="font-size:12px;opacity:0.7">thời gian còn lại</span>
  </div>
</div>

<!-- Buttons -->
<button class="btn-start" id="btn-start" onclick="startVerify()">🚀 Bắt đầu xác thực</button>

<!-- Hidden WebView iframe -->
<div id="webframe-wrap">
  <div id="webframe-header">
    <span>🌐</span>
    <span id="webframe-url">unlockffbeta.com</span>
    <button class="close-btn" onclick="hideFrame()">✕ Đóng</button>
  </div>
  <iframe id="webframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation"></iframe>
</div>

<script>
// ═══════════════════════════════════════════════
//  TELEGRAM MINI APP INIT
// ═══════════════════════════════════════════════
const tgApp = window.Telegram && window.Telegram.WebApp;
if (tgApp) {
  tgApp.ready();
  tgApp.expand();
}

// Đọc accountId từ URL param hoặc initData
const urlParams = new URLSearchParams(window.location.search);
let ACCOUNT_ID = urlParams.get('id') || '';

// Thử đọc từ Telegram initData
if (!ACCOUNT_ID && tgApp && tgApp.initDataUnsafe) {
  const startParam = tgApp.initDataUnsafe.start_param || '';
  if (/^\d{6,15}$/.test(startParam)) ACCOUNT_ID = startParam;
}

document.getElementById('el-id').textContent = ACCOUNT_ID || 'Chưa có ID';
if (!ACCOUNT_ID) {
  document.getElementById('btn-start').disabled = true;
  setStatus('❌', 'Không có ID', 'Quay lại bot và gửi lại ID');
}

// ═══════════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════════
function setStatus(icon, text, sub) {
  document.getElementById('st-icon').textContent = icon;
  document.getElementById('st-text').textContent = text;
  document.getElementById('st-sub').textContent  = sub || '';
}
function setProgress(pct) {
  document.getElementById('pbar').style.width = pct + '%';
}
function setStep(n) { // n = 1..4, done=5
  for (let i = 1; i <= 4; i++) {
    const el = document.getElementById('s' + i);
    el.classList.remove('active', 'done');
    if (i < n)       el.classList.add('done');
    else if (i === n) el.classList.add('active');
  }
  setProgress(n <= 4 ? (n - 1) * 25 : 100);
}
function addLog(msg) {
  const el = document.getElementById('log');
  el.textContent = msg;
}
function fmtTime(secs) {
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  if (h > 0) return `${h}h ${m}m ${s}s`;
  if (m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}

function showSuccess(expSecs) {
  document.getElementById('card-progress').style.display = 'none';
  document.getElementById('btn-start').style.display = 'none';
  const sw = document.getElementById('success-wrap');
  sw.classList.add('show');
  document.getElementById('el-expires').textContent = fmtTime(expSecs);

  // Gửi kết quả về bot qua sendData
  const payload = JSON.stringify({ status: 'granted', id: ACCOUNT_ID, expires: expSecs });
  if (tgApp) {
    setTimeout(() => {
      try { tgApp.sendData(payload); } catch(e) {}
      // Đóng Mini App sau khi gửi
      setTimeout(() => { try { tgApp.close(); } catch(e) {} }, 1500);
    }, 800);
  }
}

// ═══════════════════════════════════════════════
//  IFRAME / WEBVIEW ENGINE
// ═══════════════════════════════════════════════
let frameReady = false;
let verifying  = false;
let stepCount  = 0;

function showFrame() {
  const wrap = document.getElementById('webframe-wrap');
  wrap.classList.add('visible');
}
function hideFrame() {
  document.getElementById('webframe-wrap').classList.remove('visible');
}

// ── JS inject y hệt BackgroundWebVerifier.java ──
function buildAutoJs(accountId) {
  return `(function(){
if(window.__miniapp_v1)return;
window.__miniapp_v1=true;
window.__result=null;
window.__bgClickPending=false;
window.__bgLastClick=0;
var MYID=${JSON.stringify(String(accountId))};
var STATE=0;var busyUntil=0;var grantedMode=false;var clickCount=0;

function setVal(el,v){
  try{var s=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set;
  s.call(el,v);
  ['input','change','keyup','keydown'].forEach(function(n){el.dispatchEvent(new Event(n,{bubbles:true,cancelable:true}));});
  }catch(ex){el.value=v;['input','change'].forEach(function(n){el.dispatchEvent(new Event(n,{bubbles:true,cancelable:true}));});}
}
function forceEnableBtn(el){
  if(!el)return;
  try{el.removeAttribute('disabled');}catch(e){}
  try{el.removeAttribute('aria-disabled');}catch(e){}
  try{el.style.pointerEvents='auto';}catch(e){}
  try{el.style.opacity='1';}catch(e){}
}
function forceTap(el){
  if(!el)return false;
  forceEnableBtn(el);
  try{el.scrollIntoView({block:'center',behavior:'instant'});}catch(e){}
  var r=el.getBoundingClientRect();
  var cx=r.left+r.width/2,cy=r.top+r.height/2;
  var o={bubbles:true,cancelable:true,view:window,clientX:cx,clientY:cy,button:0,buttons:1};
  try{el.dispatchEvent(new MouseEvent('mousedown',o));}catch(e){}
  try{el.dispatchEvent(new MouseEvent('mouseup',o));}catch(e){}
  try{el.dispatchEvent(new MouseEvent('click',Object.assign({},o,{detail:1})));}catch(e){}
  try{el.click();}catch(e){}
  return true;
}
function getAllElements(sel,root){
  root=root||document;
  var r=Array.from(root.querySelectorAll(sel));
  root.querySelectorAll('*').forEach(function(el){if(el.shadowRoot)r=r.concat(getAllElements(sel,el.shadowRoot));});
  return r;
}
function isClickable(el){
  try{var r=el.getBoundingClientRect();if(r.width===0&&r.height===0)return false;
  var cs=window.getComputedStyle(el);
  if(cs.display==='none'||cs.visibility==='hidden'||cs.opacity==='0')return false;}catch(e){}
  return true;
}
function findContinueWithoutDiscordBtn(){
  var all=getAllElements('*');
  for(var i=0;i<all.length;i++){var el=all[i];if(!isClickable(el))continue;var t=(el.innerText||el.textContent||'').toLowerCase().replace(/\\s+/g,' ').trim();if(t==='continue without discord')return el;}
  for(var i=0;i<all.length;i++){var el=all[i];if(!isClickable(el))continue;var t2=(el.innerText||el.value||el.textContent||'').toLowerCase().replace(/\\s+/g,' ').trim();if(t2.indexOf('without')>=0&&t2.indexOf('discord')>=0&&t2.indexOf('join')<0&&t2.length<120)return el;}
  for(var i=0;i<all.length;i++){var el=all[i];if(!isClickable(el))continue;var t3=(el.innerText||el.value||el.textContent||'').toLowerCase().replace(/\\s+/g,' ').trim();if(t3.startsWith('continue without')&&t3.length<120)return el;}
  return null;
}
function findContinueBtn(){
  var c=findContinueWithoutDiscordBtn();if(c)return c;
  var all=getAllElements('button,a,[role="button"],[class*="btn"],[class*="continue"],[class*="Continue"]');
  for(var i=0;i<all.length;i++){var t=(all[i].innerText||all[i].value||all[i].textContent||'').toLowerCase().trim();if(t.indexOf('continue')>=0&&t.indexOf('join')<0&&t.indexOf('discord')<0&&t.indexOf('restart')<0&&t.length<80)return all[i];}
  return null;
}
function readGrantedTimer(){
  var texts=[];document.querySelectorAll('*').forEach(function(el){if(el.children.length===0){var t=(el.innerText||el.textContent||'').trim();if(t)texts.push(t);}});
  for(var i=0;i<texts.length;i++){var t=texts[i];var m;
    m=t.match(/^(\\d+)h\\s*(\\d+)m\\s*(\\d+)s$/);if(m)return +m[1]*3600+ +m[2]*60+ +m[3];
    m=t.match(/^(\\d+)m\\s*(\\d+)s$/);if(m)return +m[1]*60+ +m[2];
    m=t.match(/^(\\d+)s$/);if(m&&+m[1]<7200)return +m[1];}
  var b=document.body.innerText||'';
  var m2=b.match(/(\\d+)h\\s*(\\d+)m\\s*(\\d+)s/);if(m2)return +m2[1]*3600+ +m2[2]*60+ +m2[3];
  m2=b.match(/(\\d+)m\\s*(\\d+)s/);if(m2)return +m2[1]*60+ +m2[2];
  return -1;
}
function getStep(){
  var b=(document.body&&(document.body.innerText||document.body.textContent)||'').toLowerCase();
  if(b.indexOf('access granted')>=0)return 'granted';
  if(b.indexOf('unlocking')>=0)return 'unlocking';
  if(b.indexOf('unlocked')>=0&&b.indexOf('continue')>=0)return 'unlocked';
  if(b.indexOf('verify')>=0||b.indexOf('without discord')>=0||b.indexOf('account')>=0){
    var inp=document.querySelector('input[type="number"],input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"])');
    if(inp||STATE<=1)return 'step1';}
  if(findContinueWithoutDiscordBtn())return 'step1';
  return 'unknown';
}
// Gửi progress về parent frame
function sendProgress(ev,val){
  try{window.parent.postMessage({type:'ffverify',event:ev,value:val},'*');}catch(e){}
}

function globalForceEnable(){
  try{var all=getAllElements('button,a,[role="button"],[class*="btn"]');
  for(var i=0;i<all.length;i++){var t=(all[i].innerText||all[i].textContent||'').toLowerCase();
  if(t.indexOf('continue')>=0&&t.indexOf('restart')<0&&t.indexOf('join')<0){forceEnableBtn(all[i]);}}
  }catch(e){}
}
if(window.__fev1)clearInterval(window.__fev1);
window.__fev1=setInterval(globalForceEnable,500);

// MutationObserver
var done_flag=false;var _moT=null;
var _mo=new MutationObserver(function(){
  if(done_flag)return;clearTimeout(_moT);
  _moT=setTimeout(function(){
    var now2=Date.now();if(now2>=busyUntil&&!window.__bgClickPending){
    var cwd2=findContinueWithoutDiscordBtn();
    if(cwd2&&now2-window.__bgLastClick>800){globalForceEnable();window.__bgClickPending=true;var _e2=cwd2;
      setTimeout(function(){window.__bgClickPending=false;
        var f=findContinueWithoutDiscordBtn()||_e2;
        if(f){forceEnableBtn(f);window.__bgLastClick=Date.now();forceTap(f);clickCount++;STATE=Math.max(STATE,2);busyUntil=Date.now()+2500;
          sendProgress('click',clickCount);}},250);}
    }},120);
});
try{_mo.observe(document.body||document.documentElement,{childList:true,subtree:true,attributes:true});}catch(e){}

var timerActive=false,lastTimerSec=-1;
function loop(){
  try{
  var now=Date.now();if(now<busyUntil)return;
  var step=getStep();

  if(step==='granted'){
    done_flag=true;
    if(window.__fev1)clearInterval(window.__fev1);
    if(window.__bgiv1)clearInterval(window.__bgiv1);
    var secs=readGrantedTimer();
    if(secs<=0)secs=3600;
    if(!grantedMode){grantedMode=true;STATE=10;sendProgress('granted',secs);}
    return;
  }
  if(step==='unlocking'){
    sendProgress('step','unlocking');
    var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null,false);
    var node;var t=-1;
    while(node=walker.nextNode()){var txt=(node.nodeValue||'').trim();
      var mm=txt.match(/^(\\d+)s$/);if(mm&&+mm[1]<=120){t=+mm[1];break;}
      mm=txt.match(/^(\\d+)m\\s*(\\d+)s$/);if(mm){t=+mm[1]*60+ +mm[2];break;}}
    if(t>0){lastTimerSec=t;timerActive=true;sendProgress('countdown',t);}
    else if(timerActive||lastTimerSec===0){
      timerActive=false;lastTimerSec=-1;
      var cbs=getAllElements('button,[role="button"],[class*="btn"],[class*="continue"]');var target=null;
      for(var i=0;i<cbs.length;i++){var bt=(cbs[i].innerText||'').toLowerCase().trim();
        if(bt.indexOf('continue')>=0&&bt.indexOf('discord')<0&&bt.indexOf('join')<0){target=cbs[i];break;}}
      if(target&&now-window.__bgLastClick>2000){window.__bgLastClick=now;forceTap(target);busyUntil=now+3000;sendProgress('click',++clickCount);}}
    return;
  }
  if(step==='unlocked'){
    sendProgress('step','unlocked');
    var abs=getAllElements('button,[role="button"]');var t2=null;
    for(var i=0;i<abs.length;i++){var bt=(abs[i].innerText||'').toLowerCase().trim();
      if(bt.indexOf('continue')>=0&&bt.indexOf('cancel')<0&&bt.indexOf('discord')<0&&bt.indexOf('restart')<0){t2=abs[i];break;}}
    if(t2&&now-window.__bgLastClick>2000){window.__bgLastClick=now;forceTap(t2);busyUntil=now+3000;sendProgress('click',++clickCount);}
    return;
  }
  if(step==='step1'){
    sendProgress('step','step1');
    var inp=document.querySelector('input[type="number"]');
    if(!inp)inp=document.querySelector('input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"])');
    if(inp&&inp.value!==MYID&&MYID!==''){inp.focus();setVal(inp,MYID);STATE=1;setTimeout(globalForceEnable,200);busyUntil=now+600;return;}
    if(!window.__bgClickPending&&now-window.__bgLastClick>800){
      var cBtn=findContinueWithoutDiscordBtn();
      if(cBtn){forceEnableBtn(cBtn);window.__bgClickPending=true;var _b=cBtn;
        setTimeout(function(){window.__bgClickPending=false;
          var fresh=findContinueWithoutDiscordBtn()||_b;
          if(fresh){forceEnableBtn(fresh);window.__bgLastClick=Date.now();forceTap(fresh);clickCount++;STATE=Math.max(STATE,2);busyUntil=Date.now()+2000;sendProgress('click',clickCount);}},200);
      }else{window.scrollTo(0,document.body.scrollHeight/2);busyUntil=now+150;}}
    return;
  }
  var fb=findContinueWithoutDiscordBtn();
  if(fb&&!window.__bgClickPending&&now-window.__bgLastClick>2000){
    var inp2=document.querySelector('input');
    if(inp2&&inp2.value!==MYID&&MYID!==''){setVal(inp2,MYID);busyUntil=now+800;return;}
    forceEnableBtn(fb);window.__bgClickPending=true;var _fb=fb;
    setTimeout(function(){window.__bgClickPending=false;
      var ff=findContinueWithoutDiscordBtn()||_fb;
      if(ff){forceEnableBtn(ff);window.__bgLastClick=Date.now();forceTap(ff);clickCount++;busyUntil=Date.now()+2500;sendProgress('click',clickCount);}},300);
  }
  }catch(e){}
}
if(window.__bgiv1)clearInterval(window.__bgiv1);
window.__bgiv1=setInterval(loop,200);
setTimeout(loop,100);setTimeout(loop,500);setTimeout(loop,1000);setTimeout(loop,2000);setTimeout(loop,3500);
})();`;
}

// ── Nhận message từ iframe ──
let lastStep = '';
let clicksDetected = 0;

window.addEventListener('message', function(e) {
  const d = e.data;
  if (!d || d.type !== 'ffverify') return;

  if (d.event === 'granted') {
    const secs = parseInt(d.value) || 3600;
    hideFrame();
    setStatus('✅', 'Xác thực thành công!', 'Access Granted · ' + fmtTime(secs));
    setProgress(100);
    for (let i = 1; i <= 4; i++) document.getElementById('s' + i).classList.add('done');
    showSuccess(secs);
  } else if (d.event === 'step') {
    const stepNames = { step1: 1, unlocking: 2, unlocked: 3 };
    const n = stepNames[d.value];
    if (n && d.value !== lastStep) {
      lastStep = d.value;
      setStep(n);
      const labels = { step1: 'Bước 1: Điền ID...', unlocking: 'Bước 2–3: Đợi mở khóa...', unlocked: 'Bước 4: Click tiếp tục...' };
      setStatus('⚙️', labels[d.value] || 'Đang xử lý...', 'JS đang tự động click');
      addLog('Step: ' + d.value);
    }
  } else if (d.event === 'click') {
    clicksDetected = parseInt(d.value) || clicksDetected + 1;
    addLog('Click #' + clicksDetected + ' · đang click qua các bước...');
    setStep(Math.min(clicksDetected, 4));
  } else if (d.event === 'countdown') {
    addLog('Countdown: ' + d.value + 's · đang chờ...');
    setStatus('⏱', 'Đang chờ đếm ngược...', d.value + 's còn lại');
  }
});

// ── Inject JS vào iframe (sau khi load) ──
let injectInterval = null;
let injected = false;

function tryInject() {
  const frame = document.getElementById('webframe');
  if (!frame || !frame.contentWindow) return;
  try {
    const js = buildAutoJs(ACCOUNT_ID);
    frame.contentWindow.eval(js);
    injected = true;
    addLog('JS injected OK');
  } catch(e) {
    // Cross-origin fallback — inject qua contentDocument.write (nếu same-origin)
    try {
      const doc = frame.contentDocument;
      if (doc && doc.body) {
        const sc = doc.createElement('script');
        sc.textContent = buildAutoJs(ACCOUNT_ID);
        doc.head.appendChild(sc);
        injected = true;
        addLog('JS injected via createElement OK');
      }
    } catch(e2) {
      addLog('Cross-origin · dùng mode WebView thật');
    }
  }
}

// ═══════════════════════════════════════════════
//  MAIN — startVerify()
// ═══════════════════════════════════════════════
function startVerify() {
  if (!ACCOUNT_ID) return;
  if (verifying) return;
  verifying = true;

  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-start').textContent = '⏳ Đang xác thực...';
  setStatus('🌐', 'Đang kết nối...', 'unlockffbeta.com');
  setStep(1);

  const frame = document.getElementById('webframe');
  document.getElementById('webframe-url').textContent = 'Đang tải unlockffbeta.com...';

  // Không hiển thị iframe (ẩn) — chạy ngầm
  // Nếu muốn user thấy tiến trình thật, bật showFrame()
  // showFrame();  ← bật nếu cần debug

  frame.onload = function() {
    document.getElementById('webframe-url').textContent = frame.src || 'unlockffbeta.com';
    addLog('Page loaded, injecting JS...');
    injected = false;

    // Inject nhiều lần như BackgroundWebVerifier.java
    const delays = [800, 1800, 3500, 7000, 11000, 16000];
    delays.forEach(d => {
      setTimeout(() => {
        if (!injected) tryInject();
        else {
          // Reset guard để re-inject (phòng SPA navigate)
          try { frame.contentWindow.eval('window.__miniapp_v1=false;'); } catch(e) {}
          tryInject();
        }
      }, d);
    });
  };

  frame.src = 'https://www.unlockffbeta.com/';

  // Timeout 4 phút
  setTimeout(() => {
    if (verifying && document.getElementById('btn-start').disabled) {
      verifying = false;
      setStatus('❌', 'Timeout!', 'Không nhận được Access Granted sau 4 phút');
      document.getElementById('btn-start').disabled = false;
      document.getElementById('btn-start').textContent = '🔄 Thử lại';
      hideFrame();
    }
  }, 4 * 60 * 1000);
}

// ── Nếu là Telegram Mini App thật, đăng ký nút chính ──
if (tgApp && tgApp.MainButton) {
  tgApp.MainButton.setText('🚀 Xác thực ngay');
  tgApp.MainButton.show();
  tgApp.MainButton.onClick(startVerify);
}
